<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 13 - CSS Transition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .square {
            width: 100px;
            height: 100px;
            background-color: pink;
            margin: 40px;
            transition: all 0.5s ease;
            display: flex;
            align-items: flex-start;
            font-size: 20px;
        }

        /* Square 1 becomes longer */
        .square1:hover {
            width: 400px;
        }

        /* Square 2 becomes larger */
        .square2:hover {
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <h1>Exercise 13 - CSS Transition</h1>

    <div class="square square1">1</div>
    <div class="square square2">2</div>
</body>
</html>
